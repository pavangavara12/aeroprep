<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AeroPrep is an interactive, premium training platform designed to sharpen communication, soft skills, aptitude reasoning, and mock interview performance." />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1017" media="(prefers-color-scheme: dark)" />
    <title>AeroPrep | Interview & Soft Skills Platform</title>
    <script>
      // Apply the saved (or system) colour theme before first paint to
      // avoid a flash of the wrong theme. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('aeroprep_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
